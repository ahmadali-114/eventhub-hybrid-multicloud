services:
  app:
    build: .
    container_name: eventhub-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-eventhub}
      DB_USER: ${DB_USER:-eventhub_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [eventhub]

  db:
    image: mysql:8.4
    container_name: eventhub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-eventhub}
      MYSQL_USER: ${DB_USER:-eventhub_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/events.sql:/docker-entrypoint-initdb.d/01-events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [eventhub]

volumes:
  mysql_data:

networks:
  eventhub:
    driver: bridge
